<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>آسف يا مامي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Cairo',system-ui,sans-serif;color:#fff;
 background:radial-gradient(ellipse at 50% 40%,#3a0f5c 0%,#14052a 55%,#06010f 100%)}
#bg{position:fixed;inset:0;width:100%;height:100%}
#play{position:fixed;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid #e9c4ff;border-radius:50%;cursor:pointer;
 font-size:38px;color:#fff;padding-left:6px;background:linear-gradient(135deg,#9b4dff,#d36bff);
 box-shadow:0 0 24px #b45cff,0 0 60px rgba(180,92,255,.55),inset 0 0 14px rgba(255,255,255,.35);
 transition:transform .5s,opacity .5s}
#play::before,#play::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(214,150,255,.7);animation:ring 2.4s ease-out infinite}
#play::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
#play:active{transform:scale(.94)}
#play.hide{transform:scale(.2);opacity:0;pointer-events:none}
#scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .6s}
#scene.on{opacity:1}
#rose{height:min(64vh,600px);width:auto;max-width:92vw;filter:drop-shadow(0 0 26px rgba(180,92,255,.8))}
#msg{font:400 clamp(30px,9vw,52px)/1.3 'Lalezar','Cairo',sans-serif;text-align:center;color:#f6e3ff;
 text-shadow:0 0 16px #c77dff,0 0 40px #9b4dff;opacity:0;transform:translateY(20px) scale(.9);transition:opacity 1.2s,transform 1.2s}
#scene.on #msg.go{opacity:1;transform:none;animation:beat 2.6s 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.05)}}
#again{margin-top:6px;padding:8px 24px;border:1.5px solid rgba(233,196,255,.6);border-radius:999px;background:rgba(155,77,255,.25);color:#f1d9ff;
 font:700 14px 'Cairo',sans-serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s}
#again.go{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button id="play" aria-label="تشغيل">▶</button>
<div id="scene">
  <canvas id="rose" width="440" height="660"></canvas>
  <div id="msg">أنا آسف يا مامي 🥺</div>
  <button id="again">إعادة</button>
</div>

<script>
const bg = document.getElementById('bg'), fx = bg.getContext('2d');
const rose = document.getElementById('rose'), g = rose.getContext('2d');
const playBtn = document.getElementById('play'), scene = document.getElementById('scene');
const msg = document.getElementById('msg'), again = document.getElementById('again');
const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
let W, H, stars = [], petals = [], phase = 'idle', t0 = 0, timers = [];

function resize(){
  W = bg.width = innerWidth; H = bg.height = innerHeight;
  stars = Array.from({length: Math.round(W*H/9000)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.3, p:Math.random()*6.28, s:.5+Math.random()*1.5}));
}
addEventListener('resize', resize); resize();

/* purple rose: stem grows, leaves open, petals bloom layer by layer */
const stemX = u => 220 + Math.sin(u*3) * 14, stemY = u => 630 - 380*u;
function drawRose(t){
  g.clearRect(0,0,440,660);
  const s = ease(t/1.2);
  g.lineCap = 'round'; g.strokeStyle = '#3fae7a'; g.lineWidth = 9; g.shadowColor = '#7dffc0'; g.shadowBlur = 8;
  g.beginPath(); g.moveTo(stemX(0), stemY(0));
  for (let u=0; u<=s; u+=.02) g.lineTo(stemX(u), stemY(u));
  g.stroke();
  const lk = ease((t-.6)/.9);
  if (lk > 0) [[.38,-1],[.6,1]].forEach(([u,d]) => {
    g.save(); g.translate(stemX(u), stemY(u)); g.rotate(d*.9); g.scale(lk, lk);
    const lg = g.createLinearGradient(0,0,d*70,-30); lg.addColorStop(0,'#2f9b6a'); lg.addColorStop(1,'#7be0a8');
    g.fillStyle = lg; g.beginPath(); g.ellipse(d*42,0,48,19,0,0,6.283); g.fill(); g.restore();
  });
  g.save(); g.translate(stemX(1), stemY(1) - 20);
  g.shadowColor = '#c77dff'; g.shadowBlur = 24;
  for (let L=0; L<5; L++){
    const k = ease((t-1-L*.3)/1.5); if (k <= 0) continue;
    const n = 5+L, R = (128-L*23)*k;
    for (let i=0; i<n; i++){
      g.save(); g.rotate(i/n*6.283 + L*.55 + (1-k)*1.2 + Math.sin(t*.9)*.02); g.translate(0,-R*.3);
      const gr = g.createRadialGradient(0,-R*.2,3,0,-R*.2,R*.85);
      gr.addColorStop(0,`hsl(285,90%,${84-L*11}%)`); gr.addColorStop(1,`hsl(278,80%,${46-L*5}%)`);
      g.fillStyle = gr; g.strokeStyle = 'hsla(290,100%,92%,.55)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(0,-R*.3,R*.42,R*.62,0,0,6.283); g.fill(); g.stroke(); g.restore();
    }
  }
  g.restore();
}

function loop(now){
  fx.clearRect(0,0,W,H);
  stars.forEach(o => { fx.globalAlpha = .35 + .65*Math.abs(Math.sin(now/1000*o.s + o.p)); fx.fillStyle = '#f0d9ff'; fx.beginPath(); fx.arc(o.x,o.y,o.r,0,6.283); fx.fill(); });
  fx.globalAlpha = 1;
  if (phase === 'show'){
    const t = (now - t0)/1000; drawRose(t);
    if (t > 2.5 && Math.random() < .12) petals.push({x:Math.random()*W, y:-20, vy:35+Math.random()*50, a:Math.random()*6.28, w:1+Math.random()*2, sz:7+Math.random()*10, r:Math.random()*6.28});
  }
  petals = petals.filter(p => p.y < H+30);
  petals.forEach(p => {
    p.y += p.vy/60; p.a += .02; p.x += Math.sin(p.a)*p.w*.5; p.r += .02;
    fx.save(); fx.translate(p.x,p.y); fx.rotate(p.r); fx.fillStyle = 'rgba(200,120,255,.85)'; fx.shadowColor = '#c77dff'; fx.shadowBlur = 10;
    fx.beginPath(); fx.ellipse(0,0,p.sz*.45,p.sz,0,0,6.283); fx.fill(); fx.restore();
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

playBtn.onclick = () => {
  playBtn.classList.add('hide'); scene.classList.add('on'); phase = 'show'; t0 = performance.now();
  timers.push(setTimeout(() => msg.classList.add('go'), 2600), setTimeout(() => again.classList.add('go'), 6000));
};
again.onclick = () => {
  timers.forEach(clearTimeout); timers = []; phase = 'idle'; petals = [];
  scene.classList.remove('on'); msg.classList.remove('go'); again.classList.remove('go'); playBtn.classList.remove('hide');
};
</script>
</body>
</html>
